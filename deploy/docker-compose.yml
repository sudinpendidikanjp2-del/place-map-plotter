# Jalankan dari folder deploy: docker compose --env-file .env up -d --build
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: peta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: peta
    # Setelan untuk VPS 4 vCPU / 8 GB RAM. Sesuaikan dengan tabel di deploy/README.md.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c max_parallel_workers_per_gather=4
      -c jit=off
      -c random_page_cost=1.1
      -c wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peta -d peta"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tidak ada "ports": basis data hanya bisa dijangkau dari jaringan Compose.
    shm_size: 1gb

  app:
    # Pakai image rilis dari GHCR, atau bangun sendiri dengan: docker compose build
    image: ${APP_IMAGE:-ghcr.io/sudinpendidikanjp2-del/place-map-plotter:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://peta:${POSTGRES_PASSWORD}@db:5432/peta
      TRUST_PROXY: "true"
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      GOOGLE_MAP_ID: ${GOOGLE_MAP_ID:-}
      GOOGLE_SERVER_KEY: ${GOOGLE_SERVER_KEY:-}
      MEDIA_DIR: /data/media
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    volumes:
      - media:/data/media

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Pekerja sinkronisasi Dapodik (mode daemon): menerima tombol "Sinkronkan sekarang" di web dan menarik terjadwal.
  # Nyalakan sekali setelah PETA_TOKEN diisi: docker compose --profile sync up -d sync
  sync:
    profiles: ["sync"]
    image: ${SYNC_IMAGE:-ghcr.io/sudinpendidikanjp2-del/place-map-plotter-sync:latest}
    build:
      context: ..
      dockerfile: apps/sync/Dockerfile
    command: ["node", "src/run.mjs", "--daemon"]
    restart: unless-stopped
    environment:
      PETA_URL: ${PETA_URL:-http://app:3000}
      PETA_TOKEN: ${PETA_TOKEN:-}
      SYNC_EVERY_HOURS: ${SYNC_EVERY_HOURS:-168}
    volumes:
      - sync_data:/data

volumes:
  sync_data:
  media:
  pgdata:
  caddy_data:
  caddy_config:
