name: CI

# Dipakai langsung untuk pull request dan dipanggil oleh release.yml sebelum rilis.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tes dan build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: sekolah
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: peta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sekolah -d peta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://sekolah:dev@localhost:5432/peta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pemeriksaan tipe
        run: npm run typecheck
      - name: Tes unit dan integrasi
        run: npm test
      - name: Build web
        run: npm run build

  sync-worker:
    name: Pekerja sinkronisasi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Image resmi Playwright sudah berisi Chromium dan dependensinya, jadi tidak ada apt-get yang bergantung pada mirror runner.
    # Versinya harus sama dengan paket di apps/sync/package.json dan Dockerfile.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Pasang dependensi
        working-directory: apps/sync
        run: npm ci
      - name: Tes pekerja
        working-directory: apps/sync
        run: npm test

  sync-image:
    name: Image pekerja
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Hanya membangun (tanpa mendorong) agar Dockerfile dan tag image dasar Playwright terbukti valid sebelum rilis.
      - name: Bangun image pekerja
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sync/Dockerfile
          push: false
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync
